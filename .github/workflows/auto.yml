name: Update Repo

# 只要仓库有任何 push（网页上传 / git push / 任意目录丢入 .deb）都会重建索引；
# 每天再兜底跑一次，防止个别事件遗漏导致索引与实际包不一致。
on:
  push:
    branches:
      - '**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: repo-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成索引（收拢任意路径的 .deb 并重建）
        # 不再依赖 dpkg-scanpackages：它会在非 root 环境读取 000 权限的
        # control 文件时报 Permission denied 并使整个扫描失败。
        run: python3 build_index.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "索引无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 自动更新 APT 索引 [skip ci]"
          for i in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME:-main}"; then
              exit 0
            fi
            echo "推送失败，重试前先同步远端..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
          done
          echo "推送多次失败"; exit 1
