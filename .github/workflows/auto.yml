name: Update Repo
on:
  push:
    # 原为 'debs/**.deb'，该 glob 在 Actions 中匹配不稳定，易漏触发
    paths:
      - 'debs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: 生成索引
        run: |
          rm -f Packages Packages.gz Packages.bz2 Release
          dpkg-scanpackages debs /dev/null > Packages
          gzip -k -9 -f Packages
          bzip2 -k -f Packages

      - name: 生成 Release 文件
        run: |
          {
            echo "Origin: Niubiprass"
            echo "Label: Niubiprass"
            echo "Suite: stable"
            echo "Version: 1.0"
            echo "Codename: ios"
            echo "Date: $(date -u -R)"
            # 必须同时声明 arm64e，否则 rootless 包会被包管理器过滤掉
            echo "Architectures: iphoneos-arm64 iphoneos-arm64e"
            echo "Components: main"
            echo "Description: Niubiprass jailbreak repo"
            for H in MD5Sum SHA1 SHA256; do
              echo "$H:"
              case "$H" in
                MD5Sum) S=md5sum ;;
                SHA1)   S=sha1sum ;;
                SHA256) S=sha256sum ;;
              esac
              for F in Packages Packages.gz Packages.bz2; do
                echo " $($S "$F" | cut -d' ' -f1) $(stat -c%s "$F") $F"
              done
            done
          } > Release

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Packages.bz2 Release
          if git diff --cached --quiet; then
            echo "索引无变化，跳过提交"
          else
            git commit -m "chore: 自动更新 APT 索引"
            # 不使用 -f：强制推送会静默覆盖他人提交
            git push origin "${GITHUB_REF_NAME:-main}"
          fi
